<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Quiz Agro</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <section class="quiz-page">

        <div class="quiz-card">

            <h1>Quiz do Agronegócio</h1>

            <div class="progresso">

                <div id="barra"></div>

            </div>

            <h2 id="pergunta"></h2>

            <div id="respostas"></div>

            <button id="proxima" class="btn">
                Próxima
            </button>

            <div id="resultado"></div>

            <div class="acoes-finais">

                <a href="index.html"
                id="inicioBtn"
                class="btn voltar">

                    Voltar ao início

                </a>

                <button id="reiniciar"
                class="btn">

                    Reiniciar Quiz

                </button>

            </div>

        </div>

    </section>

    <footer class="footer">

    <p>
        © 2026 AgroConsciente —
        Conectando campo e cidade
    </p>

</footer>
    
    <script src="quiz.js"></script>

</body>
</html>
